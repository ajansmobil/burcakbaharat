<style>
  .bm-kurum { max-width: 820px; margin: 0 auto; padding: 2rem 1rem; font-family: inherit; }
  .bm-kurum > h2 { margin: 0 0 1.25rem 0; font-size: 1.9rem; font-weight: 700; line-height: 1.3; border-bottom: 2px solid rgba(0,0,0,0.08); padding-bottom: 0.75rem; }
  .bm-kurum .bm-lead { margin: 0 0 1rem 0; line-height: 1.75; font-size: 1.05rem; }
  .bm-kurum > h3 { margin: 2rem 0 0.75rem 0; font-size: 1.2rem; font-weight: 600; }
  .bm-kurum > p { margin: 0 0 1rem 0; line-height: 1.7; }
  .bm-kurum .bm-vurgu { border-left: 3px solid #B5831B; background: #F7F3E8; padding: 1rem 1.25rem; margin: 1.75rem 0; }
  .bm-kurum .bm-vurgu h3 { margin: 0 0 0.5rem 0; font-size: 1.05rem; font-weight: 700; }
  .bm-kurum .bm-vurgu p { margin: 0 0 0.5rem 0; line-height: 1.65; }
  .bm-kurum .bm-vurgu p:last-child { margin-bottom: 0; }
</style>
<div class="b0000-main">
  <div class="b0000-body">
    <article class="wm-metin bm-kurum">
      <h2>{{title}}</h2>
      <p class="bm-lead">{{lead}}</p>
      <h3>{{sec_ne_t}}</h3>
      <p>{{sec_ne_p}}</p>
      <h3>{{sec_kal_t}}</h3>
      <p>{{sec_kal_p}}</p>
      <div class="bm-vurgu">
        <h3>{{cta_t}}</h3>
        <p>{{cta_p}}</p>
        <p><strong>{{lbl_telefon}}:</strong> {{cta_telefon}} · <strong>{{lbl_eposta}}:</strong> {{cta_eposta}}</p>
        <p><strong>{{lbl_adres}}:</strong> {{cta_adres}}</p>
      </div>
    </article>
  </div>
</div>
