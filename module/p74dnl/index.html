{{bkc}}
<style>
  .bkc { box-sizing: border-box; width: 100%; align-self: stretch; background: #FBF6EE; color: #2B2523; padding: 56px 20px; }
  .bkc *, .bkc *::before, .bkc *::after { box-sizing: border-box; }
  .bkc-ic { max-width: 1200px; margin: 0 auto; }
  .bkc-ust { text-align: center; max-width: 720px; margin: 0 auto 32px; }
  .bkc-rozet { display: inline-block; padding: 4px 12px; border-radius: 999px; background: #8F1D2C; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .bkc-rozet:empty { display: none; }
  .bkc-baslik { margin: 12px 0 8px; font-family: var(--mx-font-heading, "Playfair Display", serif); font-size: clamp(26px, 3.2vw, 36px); color: #6E1220; }
  .bkc-alt { margin: 0; color: #5E524C; line-height: 1.7; }
  .bkc-izgara { display: grid; grid-template-columns: 1fr 1.25fr; gap: 24px; align-items: stretch; }
  .bkc-sol { display: flex; flex-direction: column; gap: 16px; }
  .bkc-kart { display: flex; gap: 16px; background: #fff; border: 1px solid #E8DCC8; border-radius: 16px; padding: 22px; box-shadow: 0 6px 20px rgba(43,37,35,.06); }
  .bkc-ikon { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(143,29,44,.10); color: #8F1D2C; font-size: 24px; }
  .bkc-bas { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: #2B2523; }
  .bkc-metin { margin: 0 0 10px; line-height: 1.6; color: #5E524C; }
  .bkc-link { display: inline-flex; align-items: center; gap: 4px; color: #8F1D2C; font-weight: 600; text-decoration: none; min-height: 32px; }
  .bkc-link:hover, .bkc-link:focus-visible { text-decoration: underline; }
  .bkc-link .material-symbols-outlined { font-size: 18px; }
  .bkc-sosyal { background: #fff; border: 1px solid #E8DCC8; border-radius: 16px; padding: 22px; }
  .bkc-soc-satir { display: flex; flex-wrap: wrap; gap: 10px; }
  .bkc a.bkc-soc { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #E8DCC8; border-radius: 12px; color: #2B2523; text-decoration: none; font-size: 14px; font-weight: 600; background: #FBF6EE; transition: background-color .2s ease, color .2s ease, border-color .2s ease; }
  .bkc a.bkc-soc:hover, .bkc a.bkc-soc:focus-visible { background: #8F1D2C; border-color: #8F1D2C; color: #fff; }
  .bkc-harita { min-height: 420px; border-radius: 16px; overflow: hidden; border: 1px solid #E8DCC8; background: #F3E9DA; box-shadow: 0 6px 20px rgba(43,37,35,.06); }
  .bkc-harita iframe { display: block; width: 100%; height: 100%; min-height: 420px; border: 0; }
  @media (max-width: 900px) { .bkc-izgara { grid-template-columns: 1fr; } .bkc-harita, .bkc-harita iframe { min-height: 320px; } }
  @media (max-width: 480px) { .bkc { padding: 40px 14px; } .bkc-kart { padding: 16px; } }
</style>
